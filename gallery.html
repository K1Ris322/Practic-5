<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея - Космические горизонты</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cosmic-bg">
        <div class="deep-space"></div>
        <div class="nebula-1"></div>
        <div class="nebula-2"></div>
        <div class="nebula-3"></div>
        <div class="milky-way"></div>
        <div class="stars-layer-1"></div>
        <div class="stars-layer-2"></div>
        <div class="stars-layer-3"></div>
        <div class="twinkling-stars"></div>
        <div class="parallax-layer">
            <div class="stars-layer-1" style="opacity: 0.3;"></div>
            <div class="stars-layer-2" style="opacity: 0.2;"></div>
        </div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <header class="main-header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-rocket"></i>
                <h1>Космические горизонты</h1>
            </div>
            <nav class="main-nav">
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Главная</a></li>
                    <li><a href="gallery.html" class="nav-link active"><i class="fas fa-camera"></i> Галерея</a></li>
                    <li><a href="contacts.html" class="nav-link"><i class="fas fa-envelope"></i> Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="gallery-main">
        <div class="container">
            <div class="controls-panel">
                <div class="stats">
                    <div class="stat-item"><i class="fas fa-image"></i> Изображений: <span id="image-counter">0</span></div>
                    <div class="stat-item"><i class="fas fa-heart"></i> Лайков: <span id="total-likes">0</span></div>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="galaxy">Галактики</button>
                    <button class="filter-btn" data-filter="planet">Планеты</button>
                    <button class="filter-btn" data-filter="nebula">Туманности</button>
                </div>
                <div class="view-controls">
                    <button id="grid-view" class="view-btn active"><i class="fas fa-th"></i> Сетка</button>
                    <button id="list-view" class="view-btn"><i class="fas fa-list"></i> Список</button>
                </div>
            </div>

            <div class="gallery-grid" id="image-gallery"></div>

            <aside class="gallery-info">
                <i class="fas fa-meteor"></i>
                <h3>Космическая справка</h3>
                <p>Вселенная состоит примерно из 100 миллиардов галактик, а в каждой галактике — сотни миллиардов звёзд.</p>
            </aside>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-info">
                <p>Филонов Кирилл, студент 1 курса, <span id="current-year"></span></p>
            </div>
            <div class="social-links">
                <a href="#"><i class="fab fa-telegram"></i></a>
                <a href="#"><i class="fab fa-vk"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
